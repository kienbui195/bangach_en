name: CI/CD

# Test chạy cho mọi push và pull request. Deploy CHỈ chạy khi push vào master (sau khi test xanh),
# không bao giờ chạy cho pull request (nên mã từ fork không chạm tới bí mật deploy).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "Chế độ deploy: changed (chỉ dịch vụ đổi) | all | rollback"
        default: changed
        type: choice
        options: [changed, all, rollback]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-api:
    name: worddefender-api (unit + e2e)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:ci@127.0.0.1:3306/worddefender_test
    defaults:
      run:
        working-directory: worddefender-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worddefender-api/package-lock.json
      - run: mysql -h127.0.0.1 -uroot -pci -e "CREATE DATABASE worddefender_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx vitest run
      - run: npm run test:e2e

  test-hub:
    name: admin-hub (e2e + giao diện)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:ci@127.0.0.1:3306/hub_test
    defaults:
      run:
        working-directory: admin-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            admin-hub/package-lock.json
            admin-hub/web/package-lock.json
      - run: mysql -h127.0.0.1 -uroot -pci -e "CREATE DATABASE hub_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run test:e2e
      - run: npm ci && npx tsc --noEmit -p . && npm run build
        working-directory: admin-hub/web

  test-game:
    name: worddefender (giao diện game)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worddefender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worddefender/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm run build

  deploy:
    name: Deploy lên VPS
    needs: [test-api, test-hub, test-game]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Chuẩn bị khóa SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Chạy ci-deploy trên VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          MODE: ${{ github.event.inputs.mode || 'changed' }}
        run: |
          # Khóa deploy chỉ chạy được đúng lệnh /srv/bin/ci-deploy (forced command trong authorized_keys).
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "root@${VPS_HOST}" "$MODE"
